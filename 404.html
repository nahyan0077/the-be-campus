<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Page Not Found | Be Campus Kottakkal</title>
  <meta name="robots" content="noindex, follow" />
  <link rel="icon" href="/assets/favicon.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@500;600;700;800&display=swap">
  <style>
    :root {
      --bg: #0d0d0d;
      --surface: #141414;
      --border: rgba(255,255,255,0.08);
      --red: #e8002d;
      --red-glow: rgba(232,0,45,0.25);
      --white: #ffffff;
      --muted: rgba(255,255,255,0.6);
      --font-body: 'Manrope', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-display: 'Sora', var(--font-body);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--white);
      font-family: var(--font-body);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow-x: hidden;
    }
    nav {
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 clamp(20px, 4vw, 72px);
      border-bottom: 1px solid var(--border);
    }
    .nav-logo img { height: 48px; }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 4rem 1.5rem;
      position: relative;
    }
    .glow {
      position: absolute;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, var(--red-glow), transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 0;
    }
    .content {
      position: relative;
      z-index: 1;
      max-width: 600px;
    }
    .badge {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--red);
      background: rgba(232,0,45,0.1);
      border: 1px solid rgba(232,0,45,0.25);
      padding: 0.35rem 0.9rem;
      border-radius: 100px;
      margin-bottom: 1.5rem;
    }
    h1 {
      font-family: var(--font-display);
      font-size: clamp(3rem, 8vw, 6rem);
      font-weight: 800;
      line-height: 1;
      margin-bottom: 1rem;
      letter-spacing: -0.04em;
    }
    h2 {
      font-family: var(--font-display);
      font-size: clamp(1.2rem, 3vw, 1.8rem);
      font-weight: 700;
      margin-bottom: 1rem;
    }
    p {
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.6;
      margin-bottom: 2rem;
    }
    .btn-group {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.85rem 1.8rem;
      border-radius: 100px;
      font-weight: 700;
      font-size: 0.92rem;
      text-decoration: none;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn-primary {
      background: var(--red);
      color: white;
      box-shadow: 0 4px 20px var(--red-glow);
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 28px var(--red-glow);
    }
    .btn-secondary {
      background: rgba(255,255,255,0.06);
      color: white;
      border: 1px solid var(--border);
    }
    .btn-secondary:hover {
      background: rgba(255,255,255,0.12);
      transform: translateY(-2px);
    }
    footer {
      border-top: 1px solid var(--border);
      padding: 2rem clamp(20px, 4vw, 72px);
      text-align: center;
      font-size: 0.85rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <nav>
    <a href="/" class="nav-logo">
      <img src="/assets/becampus_logo.png" alt="Be Campus" />
    </a>
  </nav>

  <main>
    <div class="glow"></div>
    <div class="content">
      <div class="badge">404 Error</div>
      <h1>Lost in Campus?</h1>
      <h2>The page you are looking for doesn't exist.</h2>
      <p>The link you clicked may be broken or the page may have been moved. Let's get you back on track.</p>
      <div class="btn-group">
        <a href="/" class="btn btn-primary">Return to Homepage →</a>
        <a href="/courses.html" class="btn btn-secondary">Explore Courses</a>
        <a href="/contact.html" class="btn btn-secondary">Contact Us</a>
      </div>
    </div>
  </main>

  <footer>
    <p>© 2026 Be Campus Academy, Kottakkal, Kerala. All rights reserved.</p>
  </footer>
</body>
</html>
